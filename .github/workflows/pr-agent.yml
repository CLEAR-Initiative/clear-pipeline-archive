name: pr_agent

# Qodo PR-Agent automated review, wired to Claude (Anthropic).
#
# Runs on PRs into the integration branch (dev) and on manual slash commands
# (/review, /improve, /ask) posted as issue comments. PR-Agent reads its
# config from .pr_agent.toml on the PR's BASE branch, and pull_request
# workflows run from the file on the BASE branch too — so this only takes
# effect once merged into dev.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    # Loop guard: never react to our own (Bot) comments, or PR-Agent would
    # trigger itself in an endless cycle.
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC.KEY: ${{ secrets.PR_AGENT_ANTHROPIC_KEY }}
          config.model: "anthropic/claude-sonnet-4-6"
          # Fallback MUST be another Anthropic model so PR-Agent never
          # initialises an OpenAI client (qodo-ai/pr-agent#1323) — otherwise
          # it errors on a missing OPENAI_API_KEY.
          config.fallback_models: '["anthropic/claude-sonnet-4-6"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          # These are pull_request WEBHOOK ACTION TYPES that trigger the auto
          # tools — NOT tool names. Mirror the on: pull_request: types list.
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'

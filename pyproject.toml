[project]
name = "clear-pipeline"
version = "0.1.0"
description = "CLEAR data ingestion pipeline — Dataminr signals → events → alerts"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.28",
    # ArcGIS FeatureServer client (src/clients/arcgis.py) uses requests.Session.
    "requests>=2.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "anthropic>=0.52",
    "python-dotenv>=1.0",
    "rasterio>=1.3",
    "numpy>=1.26",
    "shapely>=2.0",
    "boto3>=1.35",
    # Event classifier (lexical + semantic grouping)
    "rapidfuzz>=3.10",
    "sentence-transformers>=3.0",
    # Error tracking (Sentry-protocol — works with GlitchTip too)
    "sentry-sdk[celery]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]
# Optional extra used only by scripts/eval_translations.py — keeps the
# main pipeline image lean (no OpenAI / Gemini / Notion SDKs in prod).
# Install with:  uv pip install -e ".[eval]"
# notion-client >=2.4 ships data_sources support, which Notion's 2025-09
# API requires (older clients silently no-op schema writes).
eval = [
    "openai>=1.50",
    "google-genai>=1.0",
    "notion-client>=2.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
